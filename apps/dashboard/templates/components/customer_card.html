<div class="card shadow-sm mb-3">

    <div class="card-body">

        <h5 class="card-title">
            {{ customer.full_name }}
        </h5>

        <p class="text-muted mb-3">
            📞 {{ customer.phone_number }}
        </p>

        <strong>Vehicles</strong>

        <ul class="mb-3">

            {% for vehicle in customer.vehicles.all %}

                <li>
                    {{ vehicle.registration_number }}
                </li>

            {% empty %}

                <li>No vehicles added.</li>

            {% endfor %}

        </ul>

        <a href="{% url 'customers:detail' customer.pk %}" class="btn btn-outline-primary btn-sm">
            View Profile
        </a>

    </div>

</div>
