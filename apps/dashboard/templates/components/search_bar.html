<form method="get" class="mb-4">
    <div class="input-group input-group-lg">
        <input
            type="text"
            name="search"
            value="{{ search }}"
            class="form-control"
            placeholder="Search by name, phone number, or registration number"
            autocomplete="off"
        >

        <button class="btn btn-primary" type="submit">
            <i class="bi bi-search"></i>
            Search
        </button>
    </div>
</form>
