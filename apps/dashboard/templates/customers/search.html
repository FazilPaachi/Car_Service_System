{% extends "base.html" %}

{% block title %}
Customer Search
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h3 class="mb-4">
                    Search Customer
                </h3>

                <form>

                    <div class="input-group input-group-lg">

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Phone Number or Registration Number">

                        <button
                            class="btn btn-primary">

                            Search

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
